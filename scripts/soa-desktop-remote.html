<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mac — Son of Anton</title>
<style>
  :root { color-scheme: dark; --bg: #000; --bar: rgba(18,18,20,.92); --fg: #e8e8ea; --dim: #8a8a90; --acc: #3ea6ff; --on: #ffb000; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.3 -apple-system, system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  /* bottom is set to the bar's height while the bar shows, so the bar never covers the picture */
  #stage { position: fixed; inset: 0; overflow: hidden; background: #000; }
  #frame { position: absolute; left: 0; top: 0; transform-origin: 0 0; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; pointer-events: none; image-rendering: auto; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 6px; align-items: center; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--bar); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
  #bar::-webkit-scrollbar { display: none; }
  #bar.hidden { transform: translateY(100%); }
  #bar, #tip { transition: transform .2s ease, opacity .2s ease; }
  button, select { font: inherit; color: var(--fg); background: #2a2a2e; border: 0; border-radius: 8px; padding: 8px 11px; min-width: 40px; flex: 0 0 auto; }
  button:active { background: #3a3a40; }
  button[aria-pressed="true"] { background: var(--on); color: #000; font-weight: 600; }
  button.go { background: var(--acc); color: #000; font-weight: 600; }
  #status { color: var(--dim); font-size: 12px; margin-left: auto; padding-right: 4px; }
  #status b { color: var(--fg); font-weight: 500; }
  #tip { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: var(--bar); padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; max-width: 92vw; text-align: center; }
  #tip.show { opacity: 1; }
  #kb { position: fixed; left: -9999px; top: 0; width: 10px; height: 10px; opacity: 0; font-size: 16px; }
  #handle { position: fixed; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: 40px; height: 40px; border-radius: 20px; background: var(--bar); color: var(--fg); display: none; align-items: center; justify-content: center; font-size: 18px; }
  #handle.show { display: flex; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: #000; color: var(--dim); text-align: center; padding: 24px; }
  #overlay[hidden] { display: none; }
  /* where the last tap / drag / scroll landed on the Mac, drawn locally at once */
  #mark { position: fixed; left: 0; top: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 2px solid var(--acc); box-shadow: 0 0 0 1px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.6); pointer-events: none; opacity: 0; transform: scale(.6); transition: opacity .35s ease, transform .15s ease; }
  #mark::after { content: ''; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: var(--acc); }
  #mark.on { opacity: 1; transform: scale(1); transition: none; }
  #mark.right { border-color: var(--on); } #mark.right::after { background: var(--on); }
  #overlay h1 { font-size: 18px; font-weight: 600; color: var(--fg); margin: 0; }
  @media (prefers-reduced-motion: reduce) { #bar, #tip { transition: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="frame" role="img" aria-label="Mac display" width="1" height="1"></canvas></div>
<div id="overlay"><h1>Connecting to your Mac…</h1><div id="ovmsg">Asking the desktop for a session.</div></div>
<div id="mark" aria-hidden="true"></div>
<div id="tip"></div>
<input id="kb" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Keyboard input">
<div id="bar">
  <button id="b-kb" title="Keyboard">⌨</button>
  <button id="m-cmd" aria-pressed="false" title="Command">⌘</button>
  <button id="m-shift" aria-pressed="false" title="Shift">⇧</button>
  <button id="m-opt" aria-pressed="false" title="Option">⌥</button>
  <button id="m-ctrl" aria-pressed="false" title="Control">⌃</button>
  <button data-key="escape">esc</button>
  <button data-key="tab">tab</button>
  <button data-key="return">↩</button>
  <button data-key="delete">⌫</button>
  <button data-key="up">↑</button>
  <button data-key="down">↓</button>
  <button data-key="left">←</button>
  <button data-key="right">→</button>
  <button id="b-right" aria-pressed="false" title="Next tap is a right-click">R-click</button>
  <button id="b-fit" title="Fit to screen">fit</button>
  <select id="q" title="Quality">
    <option value="auto" selected>Auto</option>
    <option value="1440">1440p</option>
    <option value="1080">1080p</option>
    <option value="720">720p</option>
    <optgroup label="Compatibility (JPEG)">
      <option value="low">Low · 6 fps</option>
      <option value="med">Medium · 10 fps</option>
      <option value="high">High · 15 fps</option>
    </optgroup>
  </select>
  <button id="b-full" title="Full screen">⤢</button>
  <button id="b-hide" title="Hide bar">▾</button>
  <span id="status">—</span>
</div>
<div id="handle">▴</div>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const frame = $('frame'), stage = $('stage'), overlay = $('overlay'), ovmsg = $('ovmsg'), tip = $('tip'), kb = $('kb'), bar = $('bar'), status = $('status');
  // Everything is relative to document.baseURI: the daemon's preview proxy
  // injects a base element pointing at /preview/<port>/ when it serves this page.
  const base = new URL('.', document.baseURI);
  const query = location.search || '';            // keeps ?t=<pairing token> for the daemon's gate
  let ws = null, screen = { width: 1728, height: 1080 }, quality = null;
  let fps = 0, frameCount = 0, backoff = 1000, mods = new Set(), rightNext = false;
  const ctx = frame.getContext('2d', { alpha: false, desynchronized: true });
  // The canvas stands in for the old <img>: same transform, same natural size.
  Object.defineProperty(frame, 'naturalWidth', { get: () => frame.width });
  Object.defineProperty(frame, 'naturalHeight', { get: () => frame.height });
  let dragPermitted = null;                       // null = unknown; the service reports it in hello and on change

  // ── view transform (pinch-zoom + pan) ───────────────────────────────
  // fitted: the whole Mac is on screen, and stays so through a rotation,
  // a resize or a new stream size (until a pinch or a zoom takes it off fit).
  const view = { s: 1, x: 0, y: 0, nat: { w: 1, h: 1 }, fitted: true };
  function fit() {
    const sw = stage.clientWidth, sh = stage.clientHeight;
    const s = Math.min(sw / view.nat.w, sh / view.nat.h);
    view.s = s; view.x = (sw - view.nat.w * s) / 2; view.y = (sh - view.nat.h * s) / 2; view.fitted = true;
    apply();
  }
  function apply() {
    frame.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`;
  }
  // A new stream size keeps the picture where it was on screen: rescale the
  // view so the displayed rect does not jump.
  function setNat(w, h) {
    if (view.nat.w === w && view.nat.h === h) return;
    const first = view.nat.w === 1;
    if (!first) view.s *= view.nat.w / w;
    view.nat = { w, h };
    if (first || view.fitted) fit(); else { clampView(); apply(); }
  }
  function sizeCanvas(w, h) { if (frame.width !== w || frame.height !== h) { frame.width = w; frame.height = h; setNat(w, h); } }
  function zoomRel() {
    if (view.nat.w <= 1) return 1;
    return view.s / Math.min(stage.clientWidth / view.nat.w, stage.clientHeight / view.nat.h);
  }
  // What the stream should be sized for: this screen in physical pixels, and
  // how far in the user has zoomed (the service decides the encode size).
  function displayInfo() {
    const dpr = window.devicePixelRatio || 1, w = Math.round(stage.clientWidth * dpr), h = Math.round(stage.clientHeight * dpr);
    return { w, h, dpr, orient: w >= h ? 'landscape' : 'portrait', zoom: +zoomRel().toFixed(2) };
  }
  let dispT = 0;
  function reportDisplay() { clearTimeout(dispT); dispT = setTimeout(() => send({ t: 'display', ...displayInfo() }), 300); }
  function clampView() {
    const sw = stage.clientWidth, sh = stage.clientHeight, w = view.nat.w * view.s, h = view.nat.h * view.s;
    view.x = w <= sw ? (sw - w) / 2 : Math.min(0, Math.max(sw - w, view.x));
    view.y = h <= sh ? (sh - h) / 2 : Math.min(0, Math.max(sh - h, view.y));
  }
  // stage pixel → Mac point
  function toMac(cx, cy) {
    const fx = (cx - view.x) / view.s, fy = (cy - view.y) / view.s;
    return { x: Math.round(fx / view.nat.w * screen.width), y: Math.round(fy / view.nat.h * screen.height) };
  }
  function inFrame(cx, cy) {
    const fx = (cx - view.x) / view.s, fy = (cy - view.y) / view.s;
    return fx >= 0 && fy >= 0 && fx <= view.nat.w && fy <= view.nat.h;
  }

  // ── socket ───────────────────────────────────────────────────────────
  function send(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
  // One socket at a time, and none while the page is hidden: `connecting`
  // covers the token fetch, `sockGen` cancels a connect the page has since
  // abandoned (hidden, or superseded), and a socket's handlers act only while
  // it is still the current one.
  let connecting = false, retryT = 0, sockGen = 0;
  // An abandoned connect hands over to a fresh one if the page is showing again.
  function resume() { if (!document.hidden && !ws && !connecting) connect(); }
  async function connect() {
    if (ws || connecting || document.hidden) return;
    clearTimeout(retryT); retryT = 0;
    connecting = true;
    const gen = ++sockGen;
    if (!probeBroken) videoBroken = '';            // a new session tries the video stream again
    overlay.hidden = false; ovmsg.textContent = 'Asking the desktop for a session.';
    let tok;
    try {
      // Telling the Mac this screen up front lets it start the capture while
      // the socket opens (it lapses by itself if no socket follows).
      const tq = new URLSearchParams(query);
      if (wantMode() === 'h264') { const d = displayInfo(); tq.set('v', '1'); tq.set('pref', $('q').value); for (const k of ['w', 'h', 'dpr', 'zoom']) tq.set(k, d[k]); }
      const tqs = tq.toString();
      const r = await fetch(new URL('token' + (tqs ? '?' + tqs : ''), base), { cache: 'no-store', credentials: 'include' });
      if (gen !== sockGen) { connecting = false; return resume(); }
      if (r.status === 401) { connecting = false; ovmsg.textContent = 'Not paired. Open this from the Son of Anton app (WEB → ⌨ CONTROL) so the link carries your pairing.'; return; }
      if (!r.ok) throw new Error('token ' + r.status);
      const j = await r.json(); tok = j.token; if (j.screen) screen = j.screen;
      marks.token = Math.round(performance.now());
    } catch (e) {
      connecting = false;
      if (gen !== sockGen) return resume();
      ovmsg.textContent = 'Desktop not reachable (' + e.message + '). Retrying…'; return retry();
    }
    connecting = false;
    if (gen !== sockGen || document.hidden || ws) return resume();
    const wsUrl = new URL('ws', base); wsUrl.protocol = wsUrl.protocol === 'https:' ? 'wss:' : 'ws:'; wsUrl.searchParams.set('token', tok);
    // Over the tunnel the daemon gates this upgrade with the pairing token too
    // (a cookie is not guaranteed there — iOS drops it on a home-screen app),
    // so carry the page's own ?t= / ?u= along with the service token.
    for (const k of ['t', 'u']) { const v = new URLSearchParams(query).get(k); if (v && !wsUrl.searchParams.has(k)) wsUrl.searchParams.set(k, v); }
    const sock = new WebSocket(wsUrl); sock.binaryType = 'arraybuffer';
    ws = sock;
    mode = null; vReset();
    ws.onopen = () => {
      if (ws !== sock) return;
      backoff = 1000; ovmsg.textContent = 'Starting the screen…'; marks.open = Math.round(performance.now());
      pingClock();
      applyQuality();                              // declares the stream this browser can decode
    };
    ws.onmessage = (ev) => {
      if (ws !== sock) return;
      if (typeof ev.data === 'string') {
        let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
        if (m.t === 'hello') { if (m.screen) screen = m.screen; if (typeof m.dragPermitted === 'boolean') dragPermitted = m.dragPermitted; }
        if (m.t === 'drag-permission') {
          const was = dragPermitted; dragPermitted = !!m.granted;
          if (dragPermitted && was === false) showTip('Drag enabled');
        }
        if (m.t === 'status') {
          if (m.screen) screen = m.screen; quality = m.quality || quality;
          if (m.state === 'error' && mode === 'jpeg') { overlay.hidden = false; ovmsg.textContent = m.message || 'Screen capture failed.'; }
        }
        if (m.t === 'vconfig') onVConfig(m);
        if (m.t === 'vstat') vstat = m;
        if (m.t === 'pong') onPong(m);
        if (m.t === 'video-unavailable') videoUnavailable(m.message || 'video unavailable');
        return;
      }
      bytes += ev.data.byteLength;
      const kind = new Uint8Array(ev.data, 0, 1)[0];
      if (kind === 0x01) onVideo(ev.data);
      else if (kind === 0xff) onJpeg(ev.data);
    };
    ws.onclose = () => {
      if (ws !== sock) return;                       // an old socket, already let go
      ws = null; dragging = false; vReset(); overlay.hidden = false;
      if (document.hidden) return;                   // reconnects when the page shows again
      ovmsg.textContent = 'Connection dropped. Reconnecting…'; retry();
    };
    ws.onerror = () => {};
  }

  // ── H.264 (WebCodecs) ────────────────────────────────────────────────
  // Feature-detect once: no VideoDecoder, or no H.264 in it (older iOS), means
  // the JPEG stream, and the status line says so.
  const marks = {};                               // load-time milestones (ms since navigation), for diagnostics
  let mode = null, h264ok = false, videoBroken = '', probeBroken = '', vstat = null, bytes = 0, latencies = [], firstPictureMs = null, recvCount = 0, recvFps = 0, decCount = 0, decFps = 0;
  const h264Probe = (async () => {
    if (typeof VideoDecoder !== 'function' || typeof EncodedVideoChunk !== 'function') { probeBroken = videoBroken = 'no WebCodecs'; return false; }
    try {
      const r = await VideoDecoder.isConfigSupported({ codec: 'avc1.640033', optimizeForLatency: true });
      if (!r.supported) probeBroken = videoBroken = 'no H.264 decoder';
      return !!r.supported;
    } catch (_) { probeBroken = videoBroken = 'no H.264 decoder'; return false; }
  })();
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const V = { setGen: 0, dec: null, setting: false, conf: null, next: null, pending: null, hold: [], needKey: true, lastSeq: -1, recvSeq: -1, ackedSeq: -1, errors: [], codec: '', total: 0, keyAskedAt: 0 };
  // Frames waiting for the next vsync. A tunnel delivers in bursts, so two can
  // decode inside one refresh; holding at most two shows both (one refresh
  // apart) instead of discarding one, and never lets a backlog build.
  const paintQ = []; let rafId = 0;
  function vReset() {
    if (V.dec) { try { V.dec.close(); } catch (_) {} }
    V.setGen++;                                     // a decoder setup still in flight is abandoned
    Object.assign(V, { dec: null, setting: false, conf: null, next: null, pending: null, hold: [], needKey: true, lastSeq: -1, recvSeq: -1, ackedSeq: -1 });
    while (paintQ.length) paintQ.shift().close();
  }
  function b64(s) { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function onVConfig(m) {
    const conf = { codec: m.codec, description: b64(m.description), hardwareAcceleration: 'prefer-hardware', optimizeForLatency: true };
    V.codec = m.codec;
    if (V.setting) { V.pending = conf; return; }
    if (V.dec) { V.next = conf; return; }           // applied at the keyframe that follows
    setupDecoder(conf);
  }
  async function setupDecoder(conf) {
    V.setting = true;
    const g = ++V.setGen;
    let use = null;
    for (const c of [conf, { ...conf, hardwareAcceleration: 'no-preference' }]) {
      try { if ((await VideoDecoder.isConfigSupported(c)).supported) { use = c; break; } } catch (_) {}
    }
    if (!V.setting || g !== V.setGen) return;        // reset (or set up again) while we were asking
    V.setting = false;
    if (!use) { videoUnavailable('cannot decode ' + conf.codec); return; }
    const dec = new VideoDecoder({ output: onDecoded, error: onDecodeError });
    dec.configure(use); V.dec = dec; V.conf = use;
    if (V.pending) { V.next = V.pending; V.pending = null; }
    const held = V.hold; V.hold = [];
    for (const c of held) decodeChunk(c);
  }
  function askKey() {
    V.needKey = true;
    const now = performance.now(); if (now - V.keyAskedAt < 400) return; V.keyAskedAt = now;
    send({ t: 'keyframe' });
  }
  function onVideo(buf) {
    if (mode !== 'h264') return;
    const dv = new DataView(buf), key = (dv.getUint8(1) & 1) === 1, seq = dv.getUint32(2), ts = dv.getFloat64(6);
    const gap = V.lastSeq >= 0 && seq !== ((V.lastSeq + 1) >>> 0);
    V.lastSeq = seq; V.recvSeq = seq; recvCount++;
    const c = { key, ts, data: new Uint8Array(buf, 14) };
    if (!marks.video) marks.video = Math.round(performance.now());
    if (!V.dec) {                                    // still configuring: hold from a keyframe on
      if (key) V.hold = [c]; else if (V.hold.length && !gap && V.hold.length < 120) V.hold.push(c); else V.hold = [];
      return;
    }
    if (gap && !key) { askKey(); return; }           // never decode across a hole
    decodeChunk(c);
  }
  function decodeChunk(c) {
    if (!V.dec || V.dec.state === 'closed') return;
    if (c.key && V.next) { try { V.dec.configure(V.next); V.conf = V.next; } catch (e) { onDecodeError(e); return; } V.next = null; }
    if (!c.key && (V.needKey || V.dec.decodeQueueSize > 6)) { askKey(); return; }   // a slow decoder catches up at a keyframe
    try {
      V.dec.decode(new EncodedVideoChunk({ type: c.key ? 'key' : 'delta', timestamp: Math.round(c.ts * 1000), data: c.data }));
      V.needKey = false;
    } catch (e) { onDecodeError(e); }
  }
  function onDecoded(f) {
    decCount++;
    paintQ.push(f);
    while (paintQ.length > 2) paintQ.shift().close();
    if (!rafId) rafId = requestAnimationFrame(paint);
  }
  function paint() {
    rafId = 0;
    const f = paintQ.shift();
    if (!f) return;
    if (paintQ.length) rafId = requestAnimationFrame(paint);
    try {
      sizeCanvas(f.displayWidth, f.displayHeight);
      ctx.drawImage(f, 0, 0, f.displayWidth, f.displayHeight);
      frameCount++; V.total++;
      if (clock.ok) latencies.push(Date.now() + clock.offset - f.timestamp / 1000);
    } finally { f.close(); }
    firstPicture();
  }
  function onDecodeError(e) {
    const now = performance.now();
    V.errors = V.errors.filter((t) => now - t < 10000).concat(now);
    // A config that arrived for the next keyframe is the one to rebuild with:
    // the Mac will not send it again.
    const conf = V.next || V.pending || V.conf;
    console.warn('decoder error', e && e.message);
    if (V.errors.length >= 3 || !conf) { videoUnavailable('decoder failed'); return; }
    vReset(); V.codec = conf.codec;
    setupDecoder(conf); askKey();
  }
  function videoUnavailable(why) {
    videoBroken = why; vReset();
    if (mode === 'h264') { showTip('Video unavailable (' + why + ') — using JPEG'); applyQuality(); }
  }
  // Tell the Mac what arrived (nothing waits on this). Often, because the
  // Mac judges a slowing link by how much it has sent that has not been
  // reported yet: a short report interval keeps that small on a healthy link,
  // so a link that suddenly carries less shows up before seconds of video
  // are queued in it. Only sent while frames arrive (~25 bytes each).
  setInterval(() => {
    if (mode === 'h264' && V.recvSeq >= 0 && V.recvSeq !== V.ackedSeq) { V.ackedSeq = V.recvSeq; send({ t: 'vack', seq: V.recvSeq }); }
  }, 50);

  // ── JPEG (Compatibility) ─────────────────────────────────────────────
  let jpegSeq = 0, jpegShown = 0;
  function onJpeg(buf) {
    if (mode !== 'jpeg') return;
    const my = ++jpegSeq, blob = new Blob([buf], { type: 'image/jpeg' });
    const show = (img, w, h, done) => {
      if (my > jpegShown) { jpegShown = my; sizeCanvas(w, h); ctx.drawImage(img, 0, 0, w, h); frameCount++; firstPicture(); }
      done();
    };
    if (window.createImageBitmap) createImageBitmap(blob).then((b) => show(b, b.width, b.height, () => b.close())).catch(() => {});
    else {
      const url = URL.createObjectURL(blob), img = new Image();
      img.onload = () => show(img, img.naturalWidth, img.naturalHeight, () => URL.revokeObjectURL(url));
      img.onerror = () => URL.revokeObjectURL(url);
      img.src = url;
    }
  }
  function firstPicture() {
    if (!overlay.hidden) overlay.hidden = true;
    if (firstPictureMs == null) firstPictureMs = Math.round(performance.now());
  }

  // ── clock: the Mac stamps each frame; this offset turns it into latency ──
  const clock = { ok: false, offset: 0, rtt: Infinity, at: 0 };
  function pingClock() { send({ t: 'ping', c: Date.now() }); }
  function onPong(m) {
    const now = Date.now(), rtt = now - m.c;
    // Keep the tightest sample (it bounds the error), refreshed now and then.
    if (rtt <= clock.rtt * 1.2 || now - clock.at > 60000) { clock.offset = m.s - (m.c + now) / 2; clock.rtt = rtt; clock.at = now; clock.ok = true; }
  }
  let pings = 0;
  setInterval(() => { if (ws && (pings++ < 5 || pings % 10 === 0)) pingClock(); }, 1000);
  function retry() { clearTimeout(retryT); retryT = setTimeout(() => { retryT = 0; connect(); }, backoff); backoff = Math.min(15000, backoff * 1.7); }
  setInterval(() => {
    fps = frameCount; frameCount = 0; recvFps = recvCount; recvCount = 0; decFps = decCount; decCount = 0;
    const kbps = Math.round(bytes * 8 / 1000); bytes = 0;
    const mb = kbps >= 1000 ? (kbps / 1000).toFixed(1) + ' Mb/s' : kbps + ' kb/s';
    const lat = latencies.length ? latencies.sort((a, b) => a - b)[latencies.length >> 1] : null; latencies = [];
    if (!ws) status.textContent = 'offline';
    else if (mode === 'h264') {

    const h = bar.classList.contains('hidden') ? 0 : Math.ceil(bar.getBoundingClientRect().height);
    if (stage.style.bottom !== h + 'px') { stage.style.bottom = h + 'px'; onResize(); }
  }
  $('b-hide').addEventListener('click', () => { bar.classList.add('hidden'); $('handle').classList.add('show'); layoutStage(); });
  $('handle').addEventListener('click', () => { bar.classList.remove('hidden'); $('handle').classList.remove('show'); layoutStage(); });
  // A rotation keeps the picture fitted, or (zoomed in) keeps the same Mac
  // point at the middle of the screen. iOS can report the old size in the
  // first resize event, so it is settled again a moment later.
  let stageW = stage.clientWidth, stageH = stage.clientHeight;
  function onResize() {
    const sw = stage.clientWidth, sh = stage.clientHeight;
    if (sw === stageW && sh === stageH) return;
    if (view.fitted) fit();
    else { view.x += (sw - stageW) / 2; view.y += (sh - stageH) / 2; clampView(); apply(); }
    stageW = sw; stageH = sh; reportDisplay();
  }
  window.addEventListener('resize', () => { layoutStage(); onResize(); setTimeout(() => { layoutStage(); onResize(); }, 250); });
  if (window.ResizeObserver) { new ResizeObserver(() => layoutStage()).observe(bar); new ResizeObserver(() => onResize()).observe(stage); }
  layoutStage();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      // Hidden: nothing streams. A tap still waiting out the double-tap
      // window and a held button go first (close() flushes what was sent).
      clearTimeout(retryT); retryT = 0; sockGen++;
      if (ws) {
        flushTap(); if (dragging) dragEnd(); endScroll();
        const s = ws; ws = null; dragging = false; vReset();
        try { s.close(); } catch (_) {}
        overlay.hidden = false; ovmsg.textContent = 'Paused while this page is hidden.';
      }
    } else if (!ws) { backoff = 1000; connect(); }
  });
  h264Probe.then((ok) => {
    h264ok = ok;
    if (!ok) showTip('This browser cannot decode the video stream (' + videoBroken + ') — using JPEG');
    connect();
  });
})();
</script>
</body>
